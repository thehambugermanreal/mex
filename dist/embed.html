<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07100d" />
    <title>Mex proxy embed</title>
    <script src="/wisp/wisp-client.js"></script>
    <script src="/scramjet-runtime.js"></script>
    <script src="/controller/controller.api.js"></script>
    <script src="/epoxy/index.js"></script>
    <style>
      :root {
        color: #e8f2e9;
        background: #07100d;
        font-family: Arial, sans-serif;
      }

      * { box-sizing: border-box; }
      html, body, #proxy { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #07100d; }
      #proxy { position: relative; background: #fff; }
      .proxy-frame { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
      .status {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        color: #b9fa8e;
        background: #07100d;
        font-size: 14px;
      }
      .status::before {
        width: 16px;
        height: 16px;
        margin-bottom: 12px;
        border: 2px solid rgba(185, 250, 142, .25);
        border-top-color: #b9fa8e;
        border-radius: 50%;
        animation: spin .8s linear infinite;
        content: '';
      }
      .status-message { display: grid; justify-items: center; gap: 0; }
      .error { color: #dfb887; text-align: center; }
      .error small { display: block; max-width: 420px; margin-top: 10px; color: #9aa99d; font-size: 11px; line-height: 1.5; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main id="proxy" aria-live="polite">
      <div id="status" class="status">
        <div class="status-message">Testing server...</div>
      </div>
    </main>

    <script>
      const SERVICE_WORKER_URL = '/sw.js?v=18'
      const WISP_URL = (() => {
        try {
          return localStorage.getItem('mex-wisp') || 'wss://mex-ubg-wisp.onrender.com/wisp/'
        } catch {
          return 'wss://mex-ubg-wisp.onrender.com/wisp/'
        }
      })()
      const TARGET_URL = new URLSearchParams(window.location.search).get('url') || 'https://example.com'
      const proxyRoot = document.getElementById('proxy')
      const status = document.getElementById('status')
      let statusTimer

      function setStatus(message, isError = false) {
        status.className = isError ? 'status error' : 'status'
        status.innerHTML = isError
          ? '<div class="status-message">' + message + '<small>Use embed.html?url=https://example.com with a valid HTTP or HTTPS URL.</small></div>'
          : '<div class="status-message">' + message + '</div>'
      }

      function wait(ms) {
        return new Promise((resolve) => window.setTimeout(resolve, ms))
      }

      function connectToWisp() {
        return new Promise((resolve, reject) => {
          if (!window.wisp_client || !window.wisp_client.client) {
            reject(new Error('The Wisp client is unavailable.'))
            return
          }

          let settled = false
          let connection
          const timeout = window.setTimeout(() => finish(new Error('Wisp server did not respond in time.')), 10000)

          function cleanup() {
            window.clearTimeout(timeout)
            if (!connection) return
            connection.onopen = function () {}
            connection.onerror = function () {}
            connection.onclose = function () {}
            if (connection.close && connection.connecting !== true) connection.close()
          }

          function finish(error) {
            if (settled) return
            settled = true
            cleanup()
            error ? reject(error) : resolve()
          }

          try {
            connection = new window.wisp_client.client.ClientConnection(WISP_URL)
            connection.onopen = function () { finish() }
            connection.onerror = function () { finish(new Error('Could not connect to the Wisp server.')) }
            connection.onclose = function () { finish(new Error('Wisp server closed the connection.')) }
          } catch (error) {
            finish(error instanceof Error ? error : new Error('Could not connect to the Wisp server.'))
          }
        })
      }

      function waitForWorkerActivation(worker) {
        if (worker.state === 'activated') return Promise.resolve()
        return new Promise((resolve, reject) => {
          function check() {
            if (worker.state === 'activated') {
              worker.removeEventListener('statechange', check)
              resolve()
            } else if (worker.state === 'redundant') {
              worker.removeEventListener('statechange', check)
              reject(new Error('The proxy service worker update was discarded.'))
            }
          }
          worker.addEventListener('statechange', check)
          check()
        })
      }

      async function waitForServiceWorker(registration) {
        const pendingWorker = registration.installing || registration.waiting
        if (pendingWorker) {
          await waitForWorkerActivation(pendingWorker)
          return
        }
        if (registration.active && registration.active.state === 'activated') return
        await new Promise((resolve, reject) => {
          const timeout = window.setTimeout(() => reject(new Error('The proxy service worker did not become active.')), 10000)
          function check() {
            if (registration.active && registration.active.state === 'activated') {
              window.clearTimeout(timeout)
              registration.removeEventListener('updatefound', check)
              resolve()
            }
          }
          registration.addEventListener('updatefound', check)
          check()
        })
      }

      async function waitForController(registration) {
        const expectedUrl = new URL(SERVICE_WORKER_URL, window.location.href).href
        function isController() {
          return navigator.serviceWorker.controller && navigator.serviceWorker.controller.scriptURL === expectedUrl
        }
        if (isController()) return

        await new Promise((resolve, reject) => {
          const timeout = window.setTimeout(() => {
            cleanup()
            reject(new Error('The proxy service worker did not take control of this page.'))
          }, 10000)

          function check() {
            if (!isController()) return
            cleanup()
            resolve()
          }

          function cleanup() {
            window.clearTimeout(timeout)
            navigator.serviceWorker.removeEventListener('controllerchange', check)
            registration.removeEventListener('updatefound', check)
          }

          navigator.serviceWorker.addEventListener('controllerchange', check)
          registration.addEventListener('updatefound', check)
          check()
        })
      }

      async function createProxyFrame(target) {
        if (!('serviceWorker' in navigator)) throw new Error('This browser does not support service workers.')

        const registration = await navigator.serviceWorker.register(SERVICE_WORKER_URL, {
          scope: '/',
          updateViaCache: 'none',
        })
        await registration.update()
        await waitForServiceWorker(registration)
        await waitForController(registration)

        if (!window.$scramjet || !window.$scramjetController || !window.EpoxyTransport) {
          throw new Error('The Scramjet runtime is unavailable.')
        }

        const serviceWorker = navigator.serviceWorker.controller
        if (!serviceWorker) throw new Error('The proxy service worker is not controlling this page.')

        const transport = new window.EpoxyTransport.default({ wisp: WISP_URL })
        await transport.init()
        const controller = new window.$scramjetController.Controller({
          serviceworker: serviceWorker,
          transport,
          scramjetConfig: {
            flags: {
              sourcemaps: false,
              debugSourceURL: false,
              debugTrampolines: false,
              captureErrors: false,
            },
          },
          config: {
            prefix: '/scramjet/',
            scramjetPath: '/scramjet-runtime.js',
            injectPath: '/controller/controller.inject.js',
            wasmPath: '/scramjet.wasm',
            virtualWasmPath: 'scramjet.wasm.js',
            codec: {
              encode: function (url) { return url ? encodeURIComponent(url) : url },
              decode: function (url) { return url ? decodeURIComponent(url) : url },
            },
          },
        })
        await controller.wait()

        const frame = controller.createFrame()
        frame.element.allow = 'autoplay; fullscreen; encrypted-media'
        frame.element.className = 'proxy-frame'
        frame.element.title = 'Mex proxy embed'
        proxyRoot.replaceChildren(frame.element)
        return function () { frame.go(target) }
      }

      async function start() {
        let target
        try {
          target = new URL(TARGET_URL)
          if (target.protocol !== 'http:' && target.protocol !== 'https:') throw new Error('Only HTTP and HTTPS URLs are supported.')
        } catch {
          throw new Error('Enter a valid web address.')
        }

        setStatus('Testing server...')
        await connectToWisp()

        setStatus('Loading Site...')
        const startedAt = Date.now()
        const go = await createProxyFrame(target.href)
        await wait(Math.max(0, 650 - (Date.now() - startedAt)))
        status.remove()
        go()
      }

      start().catch((error) => {
        if (statusTimer) window.clearTimeout(statusTimer)
        setStatus(error instanceof Error ? error.message : 'Could not start the proxy.', true)
      })
    </script>
  </body>
</html>
